name: Validate ForecastLab
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forecastlab
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: forecastlab_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U forecastlab -d forecastlab_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -c requirements.lock -e '.[dev,postgres,cloud,tracking]'
      - run: ruff check forecastlab tests scripts
      - run: pytest -q
        env:
          POSTGRES_TEST_URL: postgresql+psycopg://forecastlab:ci_only@localhost:5432/forecastlab_test
      - run: forecastlab --data-dir /tmp/forecastlab-ci demo > /tmp/forecastlab-demo.json
      - run: docker build -t forecastlab:test .
