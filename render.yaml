services:
  - type: web
    name: yash-forecastlab
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -c requirements.lock -e . && FORECASTLAB_DATA_DIR=.render-data forecastlab demo
    startCommand: uvicorn public_demo:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: FORECASTLAB_DATA_DIR
        value: .render-data
      - key: OMP_NUM_THREADS
        value: '1'
      - key: OPENBLAS_NUM_THREADS
        value: '1'
      - key: TOKENIZERS_PARALLELISM
        value: 'false'
