[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "forecastlab"
version = "1.0.0"
readme = "README.md"
description = "An evaluated forecasting and decision support platform"
requires-python = ">=3.11"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pandas>=2.2,<3",
 "numpy>=1.26,<3", "scikit-learn>=1.5,<2", "xgboost>=2.1,<4",
 "sqlalchemy>=2,<3", "python-multipart>=0.0.18", "joblib>=1.4",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9"]
postgres = ["psycopg[binary]>=3.2,<4"]
cloud = ["boto3>=1.35"]
tracking = ["mlflow-skinny>=2.18,<4"]
[project.scripts]
forecastlab = "forecastlab.cli:main"
[tool.setuptools.package-data]
forecastlab = ["static/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
include = ["forecastlab*"]
