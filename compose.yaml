services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://forecastlab:local_development_only@db:5432/forecastlab
      FORECASTLAB_DATA_DIR: /app/data
    volumes:
      - artifacts:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forecastlab
      POSTGRES_PASSWORD: local_development_only
      POSTGRES_DB: forecastlab
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forecastlab -d forecastlab"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  artifacts:
  postgres:
